name: debug navigation 41

on:
  push:
    branches:
      - agrippa/41-navigation-trace

permissions:
  contents: read

jobs:
  trace:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install JSON parser
        run: brew install jq
      - name: Trace navigation test
        run: |
          sed 's/zsh -f -c/zsh -x -f -c/' scripts/test-navigation.sh > scripts/test-navigation-debug.sh
          bash -x scripts/test-navigation-debug.sh
