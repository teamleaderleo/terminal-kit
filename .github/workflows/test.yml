name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install JSON parser
        run: brew install jq
      - name: Run repository tests
        run: bash scripts/test-all.sh 2>&1 | tee test.log
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7
