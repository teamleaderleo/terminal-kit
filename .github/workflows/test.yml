name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Type-check native memory daemon
        run: xcrun swiftc -swift-version 6 -parse-as-library -typecheck tools/memoryd/main.swift
      - name: Install JSON parser
        run: brew install jq
      - name: Run repository tests
        run: bash scripts/test.sh
