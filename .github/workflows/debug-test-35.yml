name: debug issue 34 test

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/test.sh'
      - '.github/workflows/debug-test-35.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install JSON parser
        run: brew install jq
      - name: Trace repository test
        run: bash -x scripts/test.sh
