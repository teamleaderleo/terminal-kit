# terminal-kit: tmux settings

set -g mouse on
set -sg escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on
set -g set-titles on
setw -g mode-keys emacs

# Modern colour and clipboard support.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -s set-clipboard external

# Blue and white status line.
set -g status-style 'bg=#0B2D4D,fg=#FFFFFF'
set -g status-left-style 'bg=#2F80ED,fg=#FFFFFF,bold'
set -g status-right-style 'bg=#0B2D4D,fg=#FFFFFF'
set -g window-status-current-style 'bg=#FFFFFF,fg=#0B2D4D,bold'
set -g pane-border-style 'fg=#4A90C2'
set -g pane-active-border-style 'fg=#FFFFFF'
set -g message-style 'bg=#2F80ED,fg=#FFFFFF'

# Reload the full tmux file with Prefix + r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux settings reloaded"

# Mouse selection copies directly to the macOS clipboard.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
