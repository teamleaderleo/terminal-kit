# terminal-kit: tmux settings

set -g mouse on
set -sg escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on
set -g set-titles on
setw -g mode-keys emacs

# Modern colour, clipboard, and graphics-protocol support.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -s set-clipboard external
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Use the terminal's ANSI palette so tmux follows cmux theme rotation.
set -g status-style 'bg=default,fg=colour7'
set -g status-left-style 'bg=colour4,fg=colour15,bold'
set -g status-right-style 'bg=default,fg=colour7'
set -g window-status-current-style 'bg=colour8,fg=colour15,bold'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g message-style 'bg=colour4,fg=colour15'

# Reload the full tmux file with Prefix + r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux settings reloaded"

# Mouse selection copies directly to the macOS clipboard.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
