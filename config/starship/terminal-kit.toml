# terminal-kit: calm, theme-responsive default prompt without Nerd Font dependencies.

add_newline = false
command_timeout = 800
format = "$directory$character"
right_format = "$cmd_duration$status$jobs"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false
read_only = " ro"
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "yellow"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

[jobs]
symbol = "jobs:"
style = "cyan"
format = "[$symbol$number]($style) "
number_threshold = 1
symbol_threshold = 1
