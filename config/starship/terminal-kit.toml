# terminal-kit: calm, theme-responsive default prompt without Nerd Font dependencies.

# Separate commands into visible turns while keeping the prompt compact.
add_newline = true
command_timeout = 800
format = "[╭─](dimmed) $directory$line_break[╰─](dimmed)$character"
right_format = "$cmd_duration$status$jobs"

[directory]
style = "blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " ro"
before_repo_root_style = "dimmed blue"
repo_root_style = "bold blue"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "yellow"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

[jobs]
symbol = "jobs:"
style = "cyan"
format = "[$symbol$number]($style) "
number_threshold = 1
symbol_threshold = 1
